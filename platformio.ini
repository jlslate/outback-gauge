; Outback gauge pod: Waveshare ESP32-S3-Touch-LCD-1.46B (ESP32-S3R8, 16MB flash,
; 8MB octal PSRAM, 412x412 SPD2010 round display) reading OBD-II over BLE.
;
; Two builds:
;   outback_gauge      real data from a BLE OBD adapter (OBDLink CX, Vgate, ...)
;   outback_gauge_sim  fake but plausible data, for bench testing without the car

[env]
; Same platform release as sensecap-camera-viewer (Arduino core 3.1.0).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -I include
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; the USB-C port is wired straight to the S3's native USB
    -D LV_CONF_INCLUDE_SIMPLE     ; LVGL picks up include/lv_conf.h

lib_deps =
    moononournation/GFX Library for Arduino@1.6.7  ; has the SPD2010 panel driver
    lvgl/lvgl@8.3.11                               ; lv_meter gives anti-aliased gauge needles

[env:outback_gauge]

[env:outback_gauge_sim]
build_flags =
    ${env.build_flags}
    -D OBD_SIMULATE=1
